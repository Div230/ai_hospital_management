name: AIHMS validation
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: aihms_test_base
          POSTGRES_USER: aihms
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aihms -d aihms_test_base"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DEBUG: 'True'
      USE_SQLITE: 'False'
      DB_NAME: aihms_test_base
      DB_USER: aihms
      DB_PASSWORD: synthetic-ci-only
      DB_HOST: localhost
      DB_PORT: '5432'
      USE_REDIS_CHANNEL_LAYER: 'True'
      OUTBOUND_NOTIFICATIONS_ENABLED: 'False'
      EXTERNAL_AI_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -c "import secrets, os; open(os.environ['GITHUB_ENV'], 'a').write('SECRET_KEY=' + secrets.token_urlsafe(64) + '\n')"
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -r requirements.txt pytest
      - run: PYTHONPATH=backend pytest -q backend/prescription_reader/tests/test_pure.py
      - run: python manage.py check && python manage.py makemigrations --check --dry-run && python manage.py migrate --noinput
        working-directory: backend
      - run: python manage.py test accounts appointments prescription_reader.tests.test_api
        working-directory: backend
      - run: python scripts/init_env.py && docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    env:
      API_INTERNAL_URL: http://127.0.0.1:18080
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:proxy
