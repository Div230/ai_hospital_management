name: aihms
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &backend-env
    DB_HOST: postgres
    USE_SQLITE: 'False'
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
    USE_REDIS_CHANNEL_LAYER: 'True'
    EMAIL_HOST: mail
  volumes:
    - private_documents:/app/backend/media
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-aihms}
      POSTGRES_USER: ${DB_USER:-aihms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run python scripts/init_env.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    <<: *backend
    ports:
      - 127.0.0.1:8000:8000
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/core/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=WARNING, --concurrency=2]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping -d "celery@$$HOSTNAME" --timeout 3']
      interval: 30s
      timeout: 10s
      retries: 3
  scheduler:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=WARNING]
    depends_on:
      backend: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  mail:
    image: axllent/mailpit:latest
    ports:
      - 127.0.0.1:8025:8025
volumes:
  database:
  private_documents:
  redis_data:
